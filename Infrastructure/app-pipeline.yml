### CI/CD Pipeline for School Management System
### Stage 1 (CI): Builds and pushes container image to Azure Container Registry (ACR)
### Stage 2 (CD): Configures AKS, syncs Key Vault secrets, deploys application, and runs DB migrations
trigger:
  branches:
    include:
      - main
      - master
  paths:
    exclude:
      - Infrastructure/single-tenant/**
      - Infrastructure/shared-resource/**

name: $(Year:yy).$(Month).$(DayOfMonth).$(BuildID)-app-$(SourceBranchName)

variables:
  ServiceConnection: 'azure-spn-aetherus'
  AcrName: 'schoolsharedacr01'
  ImageName: 'school-sms'
  ResourceGroup: 'school-dev-rg'
  ClusterName: 'school-dev-aks'
  KeyVaultName: 'school-dev-vtts5o-kv'

pool:
  name: 'chattel.pool'

stages:
# ==============================================================================
# STAGE 1: CI - BUILD AND PUSH CONTAINER IMAGE TO ACR
# ==============================================================================
- stage: CI_Build_Push
  displayName: '1. Build & Push Image (CI)'
  jobs:
  - job: BuildAndPush
    displayName: 'Build and Push Image to ACR'
    steps:
    - checkout: self
    - task: AzureCLI@2
      displayName: 'Docker Login, Build & Push to ACR'
      inputs:
        azureSubscription: $(ServiceConnection)
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
              Write-Error "Docker is not installed or not in PATH on this build agent. Ensure Docker is running."
              exit 1
          }

          Write-Host "Logging into Azure Container Registry $(AcrName)..."
          az acr login --name $(AcrName)

          Write-Host "Building Docker image $(AcrName).azurecr.io/$(ImageName):$(Build.BuildId)..."
          docker build -t $(AcrName).azurecr.io/$(ImageName):$(Build.BuildId) -t $(AcrName).azurecr.io/$(ImageName):latest .
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Docker build failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

          Write-Host "Running Unit & Functional Tests (PHPUnit)..."
          $testContainer = "sms-test-$(Build.BuildId)"
          docker rm -f $testContainer 2>$null
          docker run --name $testContainer $(AcrName).azurecr.io/$(ImageName):$(Build.BuildId) phpunit --log-junit /var/www/test-results.xml
          $testExitCode = $LASTEXITCODE
          docker cp "$($testContainer):/var/www/test-results.xml" "$(System.DefaultWorkingDirectory)/test-results.xml"
          docker rm -f $testContainer

          if ($testExitCode -ne 0) {
              Write-Error "PHPUnit tests failed with exit code $testExitCode. Aborting push."
              exit $testExitCode
          }
          Write-Host "All Unit & Functional Tests passed successfully!"

          Write-Host "Pushing image to $(AcrName).azurecr.io..."
          docker push $(AcrName).azurecr.io/$(ImageName):$(Build.BuildId)
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Docker push failed for tag $(Build.BuildId) with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }
          docker push $(AcrName).azurecr.io/$(ImageName):latest
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Docker push failed for tag latest with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }
          Write-Host "Image successfully built, tested and pushed to ACR!"
    - task: PublishTestResults@2
      displayName: 'Publish Unit & Functional Test Results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/test-results.xml'
        testRunTitle: 'Laravel Unit & Functional Tests'

# ==============================================================================
# STAGE 2: CD - DEPLOY TO AZURE KUBERNETES SERVICE (AKS)
# ==============================================================================
- stage: CD_Deploy_AKS
  displayName: '2. Deploy to AKS (CD)'
  dependsOn: CI_Build_Push
  condition: succeeded()
  jobs:
  - deployment: DeployApp
    displayName: 'Deploy App to Dev Namespace'
    environment: school-dev-env
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: KubectlInstaller@0
            displayName: 'Install Kubectl'
            inputs:
              kubectlVersion: 'latest'
          - task: AzureCLI@2
            displayName: 'Attach ACR, Configure Secrets & Deploy Workload'
            inputs:
              azureSubscription: $(ServiceConnection)
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Ensure kubectl is in PATH
                if (-not (Get-Command kubectl -ErrorAction SilentlyContinue)) {
                    $wingetKubectl = "C:\Users\de\AppData\Local\Microsoft\WinGet\Packages\Kubernetes.kubectl_Microsoft.WinGet.Source_8wekyb3d8bbwe\kubectl.exe"
                    if (Test-Path $wingetKubectl) {
                        $env:PATH = "$(Split-Path $wingetKubectl);$env:PATH"
                    } else {
                        Write-Host "Installing kubectl via az aks install-cli..."
                        az aks install-cli --install-location "$env:TEMP\kubectl.exe"
                        $env:PATH = "$env:TEMP;$env:PATH"
                    }
                }

                Write-Host "1. Connecting to AKS cluster: $(ClusterName)..."
                az aks get-credentials --resource-group $(ResourceGroup) --name $(ClusterName) --overwrite-existing

                Write-Host "2. Fetching ACR credentials for image pull secret..."
                az acr update -n $(AcrName) --admin-enabled true
                $acrPassword = az acr credential show --name $(AcrName) --query "passwords[0].value" -o tsv

                Write-Host "3. Fetching database credentials from Key Vault: $(KeyVaultName)..."
                $dbHost = az keyvault secret show --vault-name $(KeyVaultName) --name mysql-host --query value -o tsv
                $dbUser = az keyvault secret show --vault-name $(KeyVaultName) --name mysql-user --query value -o tsv
                $dbPassword = az keyvault secret show --vault-name $(KeyVaultName) --name mysql-password --query value -o tsv

                Write-Host "4. Creating Kubernetes Secrets in 'dev' namespace..."
                kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -

                # Create Docker registry pull secret for ACR
                kubectl create secret docker-registry acr-secret `
                  --namespace dev `
                  --docker-server="$(AcrName).azurecr.io" `
                  --docker-username="$(AcrName)" `
                  --docker-password="$acrPassword" `
                  --dry-run=client -o yaml | kubectl apply -f -
                
                # Standard Laravel 32-byte application encryption key
                $appKey = "base64:sR2kL7pQ8wX9yZ0aB1cD2eF3gH4iJ5kL6mN7oP8qR9s="
                
                kubectl create secret generic school-sms-secrets `
                  --namespace dev `
                  --from-literal=DB_HOST="$dbHost" `
                  --from-literal=DB_USERNAME="$dbUser" `
                  --from-literal=DB_PASSWORD="$dbPassword" `
                  --from-literal=DB_DATABASE="school_sms" `
                  --from-literal=APP_KEY="$appKey" `
                  --dry-run=client -o yaml | kubectl apply -f -

                Write-Host "5. Applying School Deployment, Service and Ingress..."
                kubectl apply -f "$(System.DefaultWorkingDirectory)/Infrastructure/K8-ingress-setup/school-sms-deployment.yaml"
                kubectl apply -f "$(System.DefaultWorkingDirectory)/Infrastructure/K8-ingress-setup/school-ingress.yaml"

                Write-Host "Updating deployment to use fresh image tag: $(Build.BuildId)..."
                kubectl set image deployment/school-sms school-sms="$(AcrName).azurecr.io/$(ImageName):$(Build.BuildId)" -n dev

                Write-Host "6. Waiting for School SMS pod to be ready..."
                kubectl rollout status deployment/school-sms -n dev --timeout=300s
                if ($LASTEXITCODE -ne 0) {
                    Write-Host "Pod rollout timed out. Checking pod details..."
                    kubectl describe pod -l app=school-sms -n dev
                    kubectl logs -l app=school-sms -n dev --tail=50
                    exit 1
                }

                Write-Host "7. Running Database Migrations..."
                kubectl exec -n dev deployment/school-sms -c school-sms -- php artisan migrate --force

                Write-Host "Seeding database default records..."
                kubectl exec -n dev deployment/school-sms -c school-sms -- php artisan db:seed --force

                Write-Host "Ensuring storage permissions..."
                kubectl exec -n dev deployment/school-sms -c school-sms -- sh -c "chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache && chmod -R 777 /var/www/storage /var/www/bootstrap/cache"

                Write-Host "8. Verifying Dev Deployment..."
                kubectl get pods,svc,ingress -n dev

                Write-Host "9. Running Live Functional & Smoke Tests..."
                $testUrl = "http://school.hdps.online/login"
                Write-Host "Testing HTTP response from $testUrl..."
                for ($attempt = 1; $attempt -le 6; $attempt++) {
                    try {
                        $res = Invoke-WebRequest -Uri $testUrl -UseBasicParsing -TimeoutSec 15
                        if ($res.StatusCode -eq 200) {
                            Write-Host "SUCCESS: Live endpoint $testUrl is responding with HTTP 200 OK!"
                            break
                        }
                    } catch {
                        Write-Host "Attempt $attempt/6: Waiting for endpoint readiness ($($_))..."
                        Start-Sleep -Seconds 5
                    }
                }

