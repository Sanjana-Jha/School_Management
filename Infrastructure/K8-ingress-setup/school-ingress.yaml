---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: school-sms-ingress
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  ingressClassName: nginx
  rules:
  - host: school.hdps.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: school-sms-service
            port:
              number: 80
  # Fallback rule allowing direct access via Public IP as well
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: school-sms-service
            port:
              number: 80
