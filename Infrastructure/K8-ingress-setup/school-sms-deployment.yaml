apiVersion: apps/v1
kind: Deployment
metadata:
  name: school-sms
  namespace: dev
  labels:
    app: school-sms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: school-sms
  template:
    metadata:
      labels:
        app: school-sms
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: school-sms
        image: schoolsharedacr01.azurecr.io/school-sms:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: APP_NAME
          value: "SchoolManagement"
        - name: APP_ENV
          value: "production"
        - name: APP_DEBUG
          value: "true"
        - name: APP_URL
          value: "http://52.226.103.116"
        - name: DB_CONNECTION
          value: "mysql"
        - name: DB_PORT
          value: "3306"
        - name: DB_DATABASE
          valueFrom:
            secretKeyRef:
              name: school-sms-secrets
              key: DB_DATABASE
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: school-sms-secrets
              key: DB_HOST
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: school-sms-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: school-sms-secrets
              key: DB_PASSWORD
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: school-sms-secrets
              key: APP_KEY
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: school-sms-service
  namespace: dev
  labels:
    app: school-sms
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: school-sms

