parameters:
- name: env
  type: string
- name: ServiceConnection
  type: string
- name: ResourceGroupName
  type: string
- name: StorageAccountName
  type: string
- name: ContainerName
  type: string
- name: KeyName
  type: string
- name: environments
  type: string
- name: ResourcePath
  type: string
- name: AccountKey
  type: string
- name: variable_group
  type: string

jobs:
  - deployment: ${{ parameters.env }}_TF_APPLY
    displayName: ${{ parameters.env }}_TF_APPLY
    variables:
    - group: ${{parameters.variable_group}}
    workspace:
      clean: outputs | resources | all # what to clean up before the job
    pool:
      name: 'chattel.pool'
    environment: ${{ parameters.environments }}
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: dir $(Build.SourcesDirectory)
          # - task: AzureCLI@2
          #   displayName: Azure CLI - download plan
          #   inputs:
          #     azureSubscription: ${{ parameters.ServiceConnection }}
          #     scriptType: pscore
          #     scriptLocation: inlineScript 
          #     inlineScript: |
          #       mkdir "$(System.DefaultWorkingDirectory)\${{ parameters.ResourcePath }}\plan\"
          #       az storage blob download --file "$(System.DefaultWorkingDirectory)\${{ parameters.ResourcePath }}\plan\${{ parameters.env }}.plan" --container-name ${{ parameters.ContainerName }} --name "${{ parameters.env }}.plan" --account-name ${{ parameters.StorageAccountName }} --account-key ${{ parameters.AccountKey }}
          #       #--connection-string $(terraform_state_connection)#
          #       get-content "$(System.DefaultWorkingDirectory)/${{ parameters.ResourcePath }}\plan\${{ parameters.env }}.plan"
          #       write-host "######################################################"
          #       az storage blob show --account-name ${{ parameters.StorageAccountName }} --container-name ${{ parameters.ContainerName }} --name "${{ parameters.env }}.plan" --account-key ${{ parameters.AccountKey }}
          #       copy-item -path $(System.DefaultWorkingDirectory)/${{ parameters.ResourcePath }}/plan/${{ parameters.env }}.plan -Destination $(System.DefaultWorkingDirectory)/${{ parameters.ResourcePath }}/ 
          - task: qetza.replacetokens.replacetokens-task.replacetokens@3
            displayName: 'Replace tokens in tfvars and tf'
            inputs:
                rootDirectory: '$(System.DefaultWorkingDirectory)'
                targetFiles: |
                 $(System.DefaultWorkingDirectory)\${{ parameters.ResourcePath }}\*.tf
                 $(System.DefaultWorkingDirectory)\${{ parameters.ResourcePath }}\*.tfvars
                encoding: 'utf-8'
                actionOnMissing: 'warn'
                keepToken: false
                tokenPrefix: '__'
                tokenSuffix: '__'
          
          
          
          - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
            displayName: Install Terraform '1.15.8'
            inputs:
              terraformVersion: '1.15.8'
          - task: TerraformTaskV4@4
            displayName: 'Terraform : init'
            inputs:
               command: 'init'
               workingDirectory: $(System.DefaultWorkingDirectory)\${{ parameters.ResourcePath }}
               backendServiceArm: ${{ parameters.ServiceConnection }}
               backendAzureRmResourceGroupName: ${{ parameters.ResourceGroupName }}
               backendAzureRmStorageAccountName: ${{ parameters.StorageAccountName }}
               backendAzureRmContainerName: ${{ parameters.ContainerName }}
               backendAzureRmKey: ${{ parameters.KeyName }}
               backendType: 'azurerm'
               ensureBackend: true
          - task: PowerShell@2
            displayName: 'listfiles'
            inputs:
              targetType: inline
              script: |

                ### Create folder
                
                gci -rec  | select-object fullname
          - task: TerraformTaskV4@4
            displayName: 'Terraform : validate'
            inputs:
              command: validate
              workingDirectory: $(System.DefaultWorkingDirectory)/${{ parameters.ResourcePath }}
          - task: TerraformTaskV4@4
            displayName: 'Terraform : apply'
            inputs:
              command: apply
              workingDirectory: $(System.DefaultWorkingDirectory)\${{ parameters.ResourcePath }}
              commandOptions: -var-file="${{ parameters.env }}.tfvars"
              environmentServiceNameAzureRM: ${{ parameters.ServiceConnection }}
          - task: PowerShell@2
            displayName: read powershell outplan
            inputs:
              targetType: inline
              script: |+
                # Write your PowerShell commands here.
                Write-Host "list of files"
                gci -rec  | select-object fullname
