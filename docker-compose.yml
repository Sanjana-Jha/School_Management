services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - school_network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: school_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - school_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: school_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: school_sms
      MYSQL_ROOT_PASSWORD: secret_root_pass
      MYSQL_USER: sms_user
      MYSQL_PASSWORD: sms_user_pass
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - school_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret_root_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: school_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - school_network
    depends_on:
      - db

volumes:
  dbdata:
    driver: local

networks:
  school_network:
    driver: bridge
